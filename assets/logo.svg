<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72" role="img" aria-label="Коллекция сайтов — каталог понравившихся сайтов">
  <title>Коллекция сайтов</title>

  <!-- Марка: мозаика «окон» сайтов — та же сетка, что у assets/favicon.svg, в масштабе 2:1 -->
  <rect x="4" y="4" width="64" height="64" rx="14" fill="#1A4FBF"/>
  <rect x="18" y="18" width="16" height="16" rx="4" fill="#FFFFFF"/>
  <rect x="38" y="18" width="16" height="10" rx="4" fill="#FFFFFF" opacity="0.75"/>
  <rect x="18" y="38" width="16" height="10" rx="4" fill="#FFFFFF" opacity="0.75"/>
  <rect x="38" y="32" width="16" height="22" rx="4" fill="#FFFFFF"/>

  <!-- Название: цвета из assets/style.css (текст, акцент, muted) -->
  <text x="92" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
    <tspan>Коллекция</tspan><tspan fill="#1A4FBF"> сайтов</tspan>
  </text>
  <text x="92" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5A5A5A">каталог понравившихся сайтов</text>
</svg>
